<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 &bull; TYSON Media Group &bull; Stillness in Motion</title>
    <meta name="description" content="Celebrating 100 Subscribers across 2,199 days, 80 videos, and 14,140 views. TYSON Media Group.">
    
    <!-- Preload Fonts & Key Assets -->
    <link rel="preload" href="assets/fonts/borg9.otf" as="font" type="font/otf" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=block" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="stage-viewport">
        <!-- Top Minimalist Header -->
        <header class="stage-header" id="stage-header">
            <a href="https://rpm.tysonmediagroup.org" target="_blank" class="header-brand-link" title="Visit rpm.tysonmediagroup.org">
                <img src="assets/TYSONlogoOfficial.png" alt="TYSON Media Group Logo">
                <span>TYSON MEDIA GROUP</span>
            </a>
            <div class="header-milestone-pill">
                Ad Astra Per Aspera
            </div>
        </header>

        <!-- Main Animation Centerpiece -->
        <main class="animation-centerpiece" id="animation-stage" aria-live="polite">
            
            <!-- STAGE 1: "100" in Borg 9 Font -->
            <div class="stage-layer" id="stage-1" data-stage="1" aria-label="100">
                <svg class="trace-svg" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg">
                    <text x="50%" y="54%" class="text-borg">
                        <tspan class="trace-char" data-delay="0.05">1</tspan><tspan class="trace-char" data-delay="0.18">0</tspan><tspan class="trace-char" data-delay="0.31">0</tspan>
                    </text>
                </svg>
            </div>

            <!-- STAGE 2: "2,199 days" in Cormorant Garamond -->
            <div class="stage-layer" id="stage-2" data-stage="2" aria-label="2,199 days">
                <svg class="trace-svg" viewBox="0 0 1100 220" xmlns="http://www.w3.org/2000/svg">
                    <text x="50%" y="54%" class="text-garamond-italic">
                        <tspan class="trace-char" data-delay="0.05">2</tspan><tspan class="trace-char" data-delay="0.13">,</tspan><tspan class="trace-char" data-delay="0.21">1</tspan><tspan class="trace-char" data-delay="0.29">9</tspan><tspan class="trace-char" data-delay="0.37">9</tspan><tspan class="trace-space">&nbsp;</tspan><tspan class="trace-char" data-delay="0.45">d</tspan><tspan class="trace-char" data-delay="0.53">a</tspan><tspan class="trace-char" data-delay="0.61">y</tspan><tspan class="trace-char" data-delay="0.69">s</tspan>
                    </text>
                </svg>
            </div>

            <!-- STAGE 3: "80 videos" in Cormorant Garamond -->
            <div class="stage-layer" id="stage-3" data-stage="3" aria-label="80 videos">
                <svg class="trace-svg" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
                    <text x="50%" y="54%" class="text-garamond-italic">
                        <tspan class="trace-char" data-delay="0.05">8</tspan><tspan class="trace-char" data-delay="0.13">0</tspan><tspan class="trace-space">&nbsp;</tspan><tspan class="trace-char" data-delay="0.21">v</tspan><tspan class="trace-char" data-delay="0.29">i</tspan><tspan class="trace-char" data-delay="0.37">d</tspan><tspan class="trace-char" data-delay="0.45">e</tspan><tspan class="trace-char" data-delay="0.53">o</tspan><tspan class="trace-char" data-delay="0.61">s</tspan>
                    </text>
                </svg>
            </div>

            <!-- STAGE 4: "14,140 views" in Cormorant Garamond -->
            <div class="stage-layer" id="stage-4" data-stage="4" aria-label="14,140 views">
                <svg class="trace-svg" viewBox="0 0 1100 220" xmlns="http://www.w3.org/2000/svg">
                    <text x="50%" y="54%" class="text-garamond-italic">
                        <tspan class="trace-char" data-delay="0.05">1</tspan><tspan class="trace-char" data-delay="0.13">4</tspan><tspan class="trace-char" data-delay="0.21">,</tspan><tspan class="trace-char" data-delay="0.29">1</tspan><tspan class="trace-char" data-delay="0.37">4</tspan><tspan class="trace-char" data-delay="0.45">0</tspan><tspan class="trace-space">&nbsp;</tspan><tspan class="trace-char" data-delay="0.53">v</tspan><tspan class="trace-char" data-delay="0.61">i</tspan><tspan class="trace-char" data-delay="0.69">e</tspan><tspan class="trace-char" data-delay="0.77">w</tspan><tspan class="trace-char" data-delay="0.85">s</tspan>
                    </text>
                </svg>
            </div>

            <!-- STAGE 5: Finale Crossfade ("100 Subscribers" -> "Thank You") -->
            <div class="stage-layer" id="stage-5" data-stage="5" aria-label="100 Subscribers • Thank You">
                <div class="finale-container">
                    <!-- 100 Subscribers -->
                    <div class="finale-phrase phrase-subscribers" id="phrase-subscribers">
                        <svg class="trace-svg" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
                            <text x="50%" y="54%" class="text-stage-finale">100 Subscribers</text>
                        </svg>
                    </div>

                    <!-- Thank You (Crossfades in) -->
                    <div class="finale-phrase phrase-thankyou" id="phrase-thankyou">
                        <svg class="trace-svg" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
                            <text x="50%" y="54%" class="text-stage-finale">Thank You</text>
                        </svg>
                    </div>
                </div>
            </div>

        </main>

        <!-- Bottom Branding & Controls -->
        <footer class="stage-footer" id="stage-footer">
            <a href="https://rpm.tysonmediagroup.org" target="_blank" class="footer-logo-badge" title="TYSON Media Group">
                <img src="assets/logoforbottomofintrotrace.png" alt="T5S / TYSON Media Group">
                <div>
                    <div class="footer-domain-text">rpm.tysonmediagroup.org</div>
                    <div class="footer-tagline">Stillness in Motion</div>
                </div>
            </a>

            <!-- Dock controls: Replay & Sound -->
            <div class="controls-dock">
                <button class="ctrl-btn" id="btn-replay" title="Replay Animation (R or Space)">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                    </svg>
                    <span>Replay</span>
                </button>
                <div class="ctrl-divider"></div>
                <button class="ctrl-btn" id="btn-sound" title="Toggle Sound">
                    <svg id="icon-sound-off" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                        <line x1="23" y1="9" x2="17" y2="15"/>
                        <line x1="17" y1="9" x2="23" y2="15"/>
                    </svg>
                    <svg id="icon-sound-on" style="display:none;" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                    <span id="sound-label">Sound</span>
                </button>
                <div class="ctrl-divider"></div>
                <span class="kbd-hint">SPACE / R</span>
            </div>
        </footer>

        <!-- Hidden Audio Element for Optional Soundtrack -->
        <audio id="audio-soundtrack" src="assets/soundtrack.mp3" preload="auto"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
