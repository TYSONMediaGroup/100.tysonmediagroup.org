<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 &bull; TYSON Media Group &bull; Perspective in Motion</title>
    <meta name="description" content="Celebrating 100 Subscribers across 2,199 days, 80 videos, and 14,140 views. TYSON Media Group.">
    
    <!-- Preload Assets -->
    <link rel="preload" href="assets/TYSONMediaGroupBanner.png" as="image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=block" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
    <div class="stage-viewport">
        <!-- Top Header: Official TYSONMediaGroupBanner on left & Perspective in Motion on right -->
        <header class="stage-header" id="stage-header">
            <a href="https://tysonmediagroup.org" target="_blank" class="header-banner-link" title="Visit tysonmediagroup.org">
                <img src="assets/TYSONMediaGroupBanner.png?v=4" alt="TYSON Media Group" class="header-banner-img">
            </a>
            <div class="header-perspective-text">
                Perspective in Motion
            </div>
        </header>

        <!-- Main Animation Centerpiece (Clickable to Replay) -->
        <main class="animation-centerpiece" id="animation-stage" aria-live="polite" title="Click anywhere to Replay">
            
            <!-- STAGE 1: "100" in Borg 9 Font -->
            <div class="stage-layer" id="stage-1" data-stage="1" aria-label="100">
                <svg class="trace-svg" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg">
                    <text x="50%" y="54%" class="text-borg">
                        <tspan class="trace-char" style="--delay: 0.10s; --fill-delay: 1.45s;">1</tspan><tspan class="trace-char" style="--delay: 0.42s; --fill-delay: 1.45s;">0</tspan><tspan class="trace-char" style="--delay: 0.74s; --fill-delay: 1.45s;">0</tspan>
                    </text>
                </svg>
            </div>

            <!-- STAGE 2: "2,199 days" in Non-Italic Thin Cormorant Garamond -->
            <div class="stage-layer" id="stage-2" data-stage="2" aria-label="2,199 days">
                <svg class="trace-svg" viewBox="0 0 1100 220" xmlns="http://www.w3.org/2000/svg">
                    <text x="50%" y="54%" class="text-garamond-thin">
                        <tspan class="trace-char" style="--delay: 0.08s; --fill-delay: 1.50s;">2</tspan><tspan class="trace-char" style="--delay: 0.17s; --fill-delay: 1.50s;">,</tspan><tspan class="trace-char" style="--delay: 0.26s; --fill-delay: 1.50s;">1</tspan><tspan class="trace-char" style="--delay: 0.35s; --fill-delay: 1.50s;">9</tspan><tspan class="trace-char" style="--delay: 0.44s; --fill-delay: 1.50s;">9</tspan><tspan class="trace-space">&nbsp;</tspan><tspan class="trace-char" style="--delay: 0.58s; --fill-delay: 1.50s;">d</tspan><tspan class="trace-char" style="--delay: 0.67s; --fill-delay: 1.50s;">a</tspan><tspan class="trace-char" style="--delay: 0.76s; --fill-delay: 1.50s;">y</tspan><tspan class="trace-char" style="--delay: 0.85s; --fill-delay: 1.50s;">s</tspan>
                    </text>
                </svg>
            </div>

            <!-- STAGE 3: "80 videos" in Non-Italic Thin Cormorant Garamond -->
            <div class="stage-layer" id="stage-3" data-stage="3" aria-label="80 videos">
                <svg class="trace-svg" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
                    <text x="50%" y="54%" class="text-garamond-thin">
                        <tspan class="trace-char" style="--delay: 0.08s; --fill-delay: 1.45s;">8</tspan><tspan class="trace-char" style="--delay: 0.18s; --fill-delay: 1.45s;">0</tspan><tspan class="trace-space">&nbsp;</tspan><tspan class="trace-char" style="--delay: 0.32s; --fill-delay: 1.45s;">v</tspan><tspan class="trace-char" style="--delay: 0.42s; --fill-delay: 1.45s;">i</tspan><tspan class="trace-char" style="--delay: 0.52s; --fill-delay: 1.45s;">d</tspan><tspan class="trace-char" style="--delay: 0.62s; --fill-delay: 1.45s;">e</tspan><tspan class="trace-char" style="--delay: 0.72s; --fill-delay: 1.45s;">o</tspan><tspan class="trace-char" style="--delay: 0.82s; --fill-delay: 1.45s;">s</tspan>
                    </text>
                </svg>
            </div>

            <!-- STAGE 4: "14,140 views" in Non-Italic Thin Cormorant Garamond -->
            <div class="stage-layer" id="stage-4" data-stage="4" aria-label="14,140 views">
                <svg class="trace-svg" viewBox="0 0 1100 220" xmlns="http://www.w3.org/2000/svg">
                    <text x="50%" y="54%" class="text-garamond-thin">
                        <tspan class="trace-char" style="--delay: 0.08s; --fill-delay: 1.65s;">1</tspan><tspan class="trace-char" style="--delay: 0.17s; --fill-delay: 1.65s;">4</tspan><tspan class="trace-char" style="--delay: 0.26s; --fill-delay: 1.65s;">,</tspan><tspan class="trace-char" style="--delay: 0.35s; --fill-delay: 1.65s;">1</tspan><tspan class="trace-char" style="--delay: 0.44s; --fill-delay: 1.65s;">4</tspan><tspan class="trace-char" style="--delay: 0.53s; --fill-delay: 1.65s;">0</tspan><tspan class="trace-space">&nbsp;</tspan><tspan class="trace-char" style="--delay: 0.66s; --fill-delay: 1.65s;">v</tspan><tspan class="trace-char" style="--delay: 0.75s; --fill-delay: 1.65s;">i</tspan><tspan class="trace-char" style="--delay: 0.84s; --fill-delay: 1.65s;">e</tspan><tspan class="trace-char" style="--delay: 0.93s; --fill-delay: 1.65s;">w</tspan><tspan class="trace-char" style="--delay: 1.02s; --fill-delay: 1.65s;">s</tspan>
                    </text>
                </svg>
            </div>

            <!-- STAGE 5: Finale Crossfade ("100 Subscribers" -> "Thank You") -->
            <div class="stage-layer" id="stage-5" data-stage="5" aria-label="100 Subscribers • Thank You">
                <div class="finale-container">
                    <!-- 100 Subscribers -->
                    <div class="finale-phrase phrase-subscribers" id="phrase-subscribers">
                        <svg class="trace-svg" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
                            <text x="50%" y="54%" class="text-stage-finale">100 Subscribers</text>
                        </svg>
                    </div>

                    <!-- Thank You (Crossfades in) -->
                    <div class="finale-phrase phrase-thankyou" id="phrase-thankyou">
                        <svg class="trace-svg" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
                            <text x="50%" y="54%" class="text-stage-finale">Thank You</text>
                        </svg>
                    </div>
                </div>
            </div>

        </main>

        <!-- Bottom Footer: Clickable Italic tysonmediagroup.org & Dock Controls -->
        <footer class="stage-footer" id="stage-footer">
            <a href="https://tysonmediagroup.org" target="_blank" class="footer-domain-link" title="Visit tysonmediagroup.org">
                tysonmediagroup.org
            </a>

            <!-- Dock controls: Replay & Sound -->
            <div class="controls-dock">
                <button class="ctrl-btn" id="btn-replay" title="Replay Animation (R or Space)">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                    </svg>
                    <span>Replay</span>
                </button>
                <div class="ctrl-divider"></div>
                <button class="ctrl-btn" id="btn-sound" title="Toggle Sound">
                    <svg id="icon-sound-off" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                        <line x1="23" y1="9" x2="17" y2="15"/>
                        <line x1="17" y1="9" x2="23" y2="15"/>
                    </svg>
                    <svg id="icon-sound-on" style="display:none;" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                    <span id="sound-label">Sound</span>
                </button>
                <div class="ctrl-divider"></div>
                <span class="kbd-hint">SPACE / R</span>
            </div>
        </footer>

        <!-- Optional Soundtrack Audio -->
        <audio id="audio-soundtrack" src="assets/soundtrack.mp3" preload="auto"></audio>
    </div>

    <script src="script.js?v=4"></script>
</body>
</html>
