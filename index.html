<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 &bull; TYSON Media Group &bull; Perspective in Motion</title>
    <meta name="description" content="Celebrating 100 Subscribers across 2,199 days, 80 videos, and 14,140 views. TYSON Media Group.">
    
    <!-- Preload Fonts & Key Assets -->
    <link rel="preload" href="assets/fonts/borg9.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="assets/TYSONMediaGroupBanner.png" as="image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=block" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <div class="stage-viewport">
        <!-- Top Minimalist Header: TYSONMediaGroupBanner.png on left & Perspective in Motion on right -->
        <header class="stage-header" id="stage-header">
            <a href="https://tysonmediagroup.org" target="_blank" class="header-banner-link" title="Visit tysonmediagroup.org">
                <img src="assets/TYSONMediaGroupBanner.png" alt="TYSON Media Group" class="header-banner-img">
            </a>
            <div class="header-perspective-text">
                Perspective in Motion
            </div>
        </header>

        <!-- Main Animation Centerpiece -->
        <main class="animation-centerpiece" id="animation-stage" aria-live="polite">
            
            <!-- STAGE 1: "100" in Borg 9 Font -->
            <div class="stage-layer" id="stage-1" data-stage="1" aria-label="100">
                <svg class="trace-svg" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg">
                    <text x="50%" y="54%" class="text-borg">
                        <tspan class="trace-char" data-delay="0.08">1</tspan><tspan class="trace-char" data-delay="0.28">0</tspan><tspan class="trace-char" data-delay="0.48">0</tspan>
                    </text>
                </svg>
            </div>

            <!-- STAGE 2: "2,199 days" in Non-Italic Thin Cormorant Garamond -->
            <div class="stage-layer" id="stage-2" data-stage="2" aria-label="2,199 days">
                <svg class="trace-svg" viewBox="0 0 1100 220" xmlns="http://www.w3.org/2000/svg">
                    <text x="50%" y="54%" class="text-garamond-thin">
                        <tspan class="trace-char" data-delay="0.08">2</tspan><tspan class="trace-char" data-delay="0.18">,</tspan><tspan class="trace-char" data-delay="0.28">1</tspan><tspan class="trace-char" data-delay="0.38">9</tspan><tspan class="trace-char" data-delay="0.48">9</tspan><tspan class="trace-space">&nbsp;</tspan><tspan class="trace-char" data-delay="0.60">d</tspan><tspan class="trace-char" data-delay="0.70">a</tspan><tspan class="trace-char" data-delay="0.80">y</tspan><tspan class="trace-char" data-delay="0.90">s</tspan>
                    </text>
                </svg>
            </div>

            <!-- STAGE 3: "80 videos" in Non-Italic Thin Cormorant Garamond -->
            <div class="stage-layer" id="stage-3" data-stage="3" aria-label="80 videos">
                <svg class="trace-svg" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
                    <text x="50%" y="54%" class="text-garamond-thin">
                        <tspan class="trace-char" data-delay="0.08">8</tspan><tspan class="trace-char" data-delay="0.18">0</tspan><tspan class="trace-space">&nbsp;</tspan><tspan class="trace-char" data-delay="0.30">v</tspan><tspan class="trace-char" data-delay="0.40">i</tspan><tspan class="trace-char" data-delay="0.50">d</tspan><tspan class="trace-char" data-delay="0.60">e</tspan><tspan class="trace-char" data-delay="0.70">o</tspan><tspan class="trace-char" data-delay="0.80">s</tspan>
                    </text>
                </svg>
            </div>

            <!-- STAGE 4: "14,140 views" in Non-Italic Thin Cormorant Garamond -->
            <div class="stage-layer" id="stage-4" data-stage="4" aria-label="14,140 views">
                <svg class="trace-svg" viewBox="0 0 1100 220" xmlns="http://www.w3.org/2000/svg">
                    <text x="50%" y="54%" class="text-garamond-thin">
                        <tspan class="trace-char" data-delay="0.08">1</tspan><tspan class="trace-char" data-delay="0.18">4</tspan><tspan class="trace-char" data-delay="0.28">,</tspan><tspan class="trace-char" data-delay="0.38">1</tspan><tspan class="trace-char" data-delay="0.48">4</tspan><tspan class="trace-char" data-delay="0.58">0</tspan><tspan class="trace-space">&nbsp;</tspan><tspan class="trace-char" data-delay="0.70">v</tspan><tspan class="trace-char" data-delay="0.80">i</tspan><tspan class="trace-char" data-delay="0.90">e</tspan><tspan class="trace-char" data-delay="1.00">w</tspan><tspan class="trace-char" data-delay="1.10">s</tspan>
                    </text>
                </svg>
            </div>

            <!-- STAGE 5: Finale Crossfade ("100 Subscribers" -> "Thank You") -->
            <div class="stage-layer" id="stage-5" data-stage="5" aria-label="100 Subscribers • Thank You">
                <div class="finale-container">
                    <!-- 100 Subscribers -->
                    <div class="finale-phrase phrase-subscribers" id="phrase-subscribers">
                        <svg class="trace-svg" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
                            <text x="50%" y="54%" class="text-stage-finale">100 Subscribers</text>
                        </svg>
                    </div>

                    <!-- Thank You (Crossfades in) -->
                    <div class="finale-phrase phrase-thankyou" id="phrase-thankyou">
                        <svg class="trace-svg" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
                            <text x="50%" y="54%" class="text-stage-finale">Thank You</text>
                        </svg>
                    </div>
                </div>
            </div>

        </main>

        <!-- Bottom Footer: Italic tysonmediagroup.org & Minimalist Controls -->
        <footer class="stage-footer" id="stage-footer">
            <a href="https://tysonmediagroup.org" target="_blank" class="footer-domain-link" title="Visit tysonmediagroup.org">
                tysonmediagroup.org
            </a>

            <!-- Dock controls: Replay & Sound -->
            <div class="controls-dock">
                <button class="ctrl-btn" id="btn-replay" title="Replay Animation (R or Space)">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                    </svg>
                    <span>Replay</span>
                </button>
                <div class="ctrl-divider"></div>
                <button class="ctrl-btn" id="btn-sound" title="Toggle Sound">
                    <svg id="icon-sound-off" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                        <line x1="23" y1="9" x2="17" y2="15"/>
                        <line x1="17" y1="9" x2="23" y2="15"/>
                    </svg>
                    <svg id="icon-sound-on" style="display:none;" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                    <span id="sound-label">Sound</span>
                </button>
                <div class="ctrl-divider"></div>
                <span class="kbd-hint">SPACE / R</span>
            </div>
        </footer>

        <!-- Optional Soundtrack Audio -->
        <audio id="audio-soundtrack" src="assets/soundtrack.mp3" preload="auto"></audio>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
